name: backtest

# 開発環境からは外部に出られないので、ランナーを借りて実データで検証する。
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/backtest.yml"]

jobs:
  stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r bot/requirements.txt yfinance

      - name: 同じ戦略を日本株の日足に当てる
        run: |
          set -e
          # 株向けにリスク設定をならす（BTC の最小単位や建玉上限は意味がないため）。
          # 現物手数料は無料の証券会社が多いので 0。スプレッドぶんだけ滑りを残す。
          sed -e "s/  fee_rate: 0.0012/  fee_rate: 0.0/" \
              -e "s/  max_position_btc: 0.01/  max_position_btc: 100000/" \
              -e "s/  min_order_btc: 0.0001/  min_order_btc: 0.0/" \
              -e "s/  min_order_jpy: 500/  min_order_jpy: 100/" \
              bot/config.yml > /tmp/stock.yml

          python - <<'PY'
          from datetime import timezone

          import yfinance as yf

          from bot.backtest import run
          from bot.config import Config
          from bot.market import Candle

          NAMES = {
              "1321.T": "日経225 ETF", "1306.T": "TOPIX ETF", "7203.T": "トヨタ",
              "6758.T": "ソニー", "9984.T": "ソフトバンクG", "6857.T": "アドバンテスト",
          }

          def fetch(ticker):
              df = yf.Ticker(ticker).history(period="3y", interval="1d", auto_adjust=False)
              out = []
              for ts, row in df.iterrows():
                  dt = ts.to_pydatetime()
                  dt = dt.replace(tzinfo=timezone.utc) if dt.tzinfo is None else dt.astimezone(timezone.utc)
                  if row["Close"] != row["Close"]:  # NaN
                      continue
                  out.append(Candle(dt, float(row["Open"]), float(row["High"]),
                                    float(row["Low"]), float(row["Close"]), float(row["Volume"] or 0)))
              return out

          cfg = Config.load("/tmp/stock.yml")
          cfg.validate()
          print(f"戦略: SMA {cfg.strategy.params} / 日足 / 資金 {cfg.paper.initial_jpy:,.0f} 円")
          print(f"手数料 {cfg.paper.fee_rate:.2%} / 滑り {cfg.paper.slippage_rate:.2%}（株は現物手数料無料の想定）")
          print()
          print(f"{'銘柄':<16}{'戦略':>9}{'単純保有':>11}{'差':>9}{'取引':>6}{'勝率':>8}{'最大DD':>9}")
          print("-" * 72)
          for ticker, name in NAMES.items():
              try:
                  candles = fetch(ticker)
                  if not candles:
                      print(f"{name:<16}データが取れませんでした")
                      continue
                  r = run(candles, cfg)
              except Exception as exc:
                  print(f"{name:<16}失敗: {type(exc).__name__}: {exc}")
                  continue
              diff = r.return_pct - r.buy_hold_pct
              print(f"{name:<16}{r.return_pct:+8.2f}%{r.buy_hold_pct:+10.2f}%{diff:+8.2f}pt"
                    f"{r.trades:5}回{r.win_rate:7.1f}%{r.max_drawdown:8.2f}%")
              if ticker == "1321.T":
                  print(f"{'':<16}期間: {r.first:%Y-%m-%d} 〜 {r.last:%Y-%m-%d}（{len(candles)} 営業日）")
          PY
