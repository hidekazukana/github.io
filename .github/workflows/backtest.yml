name: backtest

# 同じ期間・同じ資金で、足の長さを変えて比べるための使い捨てワークフロー。
# 開発環境からは取引所に届かないので、ランナーを借りて実データで回す。
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/backtest.yml"]

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt

      - name: 足の長さを変えて同じ期間を比べる
        run: |
          set -e
          # 1h は 720 本、4h は 180 本 = どちらも 30 日ぶん
          run_case() {
            tf="$1"; limit="$2"; fast="$3"; slow="$4"
            sed -e "s/  timeframe: 1h/  timeframe: $tf/" \
                -e "s/    fast: 9/    fast: $fast/" \
                -e "s/    slow: 26/    slow: $slow/" \
                bot/config.yml > /tmp/bt.yml
            echo "==================================================="
            echo "  足 $tf / SMA $fast-$slow / $limit 本"
            echo "==================================================="
            python -m bot.backtest --config /tmp/bt.yml --limit "$limit" || echo "（この条件は失敗しました）"
            echo
          }

          # 手数料と滑りをゼロにして、敗因が費用なのか戦略なのかを切り分ける
          run_free() {
            fast="$1"; slow="$2"
            sed -e "s/    fast: 9/    fast: $fast/" \
                -e "s/    slow: 26/    slow: $slow/" \
                -e "s/  fee_rate: 0.0012/  fee_rate: 0.0/" \
                -e "s/  slippage_rate: 0.0005/  slippage_rate: 0.0/" \
                bot/config.yml > /tmp/bt.yml
            echo "==================================================="
            echo "  1h / SMA $fast-$slow / 手数料ゼロ・滑りゼロ"
            echo "==================================================="
            python -m bot.backtest --config /tmp/bt.yml --limit 720 || echo "（失敗）"
            echo
          }

          run_case 1h 720 9 26    # 現行（費用あり）
          run_free 9 26           # 現行と同じ戦略を費用ゼロで
          run_case 1h 720 25 75   # 取引回数を減らす（費用あり）
          run_free 25 75          # それを費用ゼロで
