name: BTC bot

# 定期実行は「デフォルトブランチ（master）にある workflow」しか動かない、という
# GitHub Actions の仕様に注意。作業ブランチで試すときは workflow_dispatch を使う。
on:
  schedule:
    - cron: "5 * * * *" # 毎時 5 分（UTC）
  workflow_dispatch:
    inputs:
      live:
        description: "実発注する（config の mode を live にしていない限り失敗します）"
        type: boolean
        default: false

# 前の実行が終わる前に次が始まると、状態ファイルの取り合いになる
concurrency:
  group: btc-bot
  cancel-in-progress: false

permissions:
  contents: write # 状態ファイルを push し返すため

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - run: pip install -r bot/requirements.txt

      - name: 設定を点検（壊れた設定のまま発注しないため）
        run: python -m bot.doctor --config bot/config.yml

      - name: 売買判断を 1 回実行
        env:
          # ドライランでは未設定でよい。実発注時のみ Secrets に登録する。
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          CONFIRM_LIVE_TRADING: ${{ inputs.live && 'yes' || '' }}
        run: python -m bot.main --config bot/config.yml ${{ inputs.live && '--live' || '' }}

      - name: 残高・取引履歴をコミットして次回に引き継ぐ
        run: |
          if [ -z "$(git status --porcelain bot/state)" ]; then
            echo "状態に変化なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/state
          git commit -m "chore(bot): 取引状態を更新 [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
